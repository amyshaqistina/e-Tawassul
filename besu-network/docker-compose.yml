name: besu-quorum-network

# 4-node Hyperledger Besu network using QBFT consensus
# (QBFT = Quorum Byzantine Fault Tolerance, the modern successor to IBFT 2.0)
#
# Network layout:
#   node1   172.16.239.11   exposes JSON-RPC on host port 8545
#   node2   172.16.239.12   internal only
#   node3   172.16.239.13   internal only
#   node4   172.16.239.14   internal only
#
# Laravel connects to: http://localhost:8545

services:

  # ------------------------------------------------------------------
  # Validator 1 — JSON-RPC endpoint (the one Laravel will talk to)
  # ------------------------------------------------------------------
  besu-node-1:
    image: hyperledger/besu:24.1.2
    container_name: besu-node-1
    user: root
    restart: unless-stopped
    entrypoint:
      - /opt/besu/bin/besu
      - --config-file=/config/config.toml
      - --data-path=/data
      - --node-private-key-file=/keys/key
      - --genesis-file=/config/genesis.json
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-api=ETH,NET,WEB3,QBFT,ADMIN,TXPOOL,DEBUG,MINER
      - --host-allowlist=*
      - --p2p-port=30303
      - --discovery-enabled=false
      - --static-nodes-file=/config/static-nodes.json
      - --min-gas-price=0
    ports:
      - "8545:8545"
      - "30303:30303"
    volumes:
      - ./config:/config:ro
      - ./nodes/node1:/keys:ro
      - besu-node-1-data:/data
    networks:
      besu-net:
        ipv4_address: 172.16.239.11

  # ------------------------------------------------------------------
  # Validator 2
  # ------------------------------------------------------------------
  besu-node-2:
    image: hyperledger/besu:24.1.2
    container_name: besu-node-2
    user: root
    restart: unless-stopped
    entrypoint:
      - /opt/besu/bin/besu
      - --config-file=/config/config.toml
      - --data-path=/data
      - --node-private-key-file=/keys/key
      - --genesis-file=/config/genesis.json
      - --p2p-port=30303
      - --discovery-enabled=false
      - --static-nodes-file=/config/static-nodes.json
      - --host-allowlist=*
      - --min-gas-price=0
    volumes:
      - ./config:/config:ro
      - ./nodes/node2:/keys:ro
      - besu-node-2-data:/data
    networks:
      besu-net:
        ipv4_address: 172.16.239.12

  # ------------------------------------------------------------------
  # Validator 3
  # ------------------------------------------------------------------
  besu-node-3:
    image: hyperledger/besu:24.1.2
    container_name: besu-node-3
    user: root
    restart: unless-stopped
    entrypoint:
      - /opt/besu/bin/besu
      - --config-file=/config/config.toml
      - --data-path=/data
      - --node-private-key-file=/keys/key
      - --genesis-file=/config/genesis.json
      - --p2p-port=30303
      - --discovery-enabled=false
      - --static-nodes-file=/config/static-nodes.json
      - --host-allowlist=*
      - --min-gas-price=0
    volumes:
      - ./config:/config:ro
      - ./nodes/node3:/keys:ro
      - besu-node-3-data:/data
    networks:
      besu-net:
        ipv4_address: 172.16.239.13

  # ------------------------------------------------------------------
  # Validator 4
  # ------------------------------------------------------------------
  besu-node-4:
    image: hyperledger/besu:24.1.2
    container_name: besu-node-4
    user: root
    restart: unless-stopped
    entrypoint:
      - /opt/besu/bin/besu
      - --config-file=/config/config.toml
      - --data-path=/data
      - --node-private-key-file=/keys/key
      - --genesis-file=/config/genesis.json
      - --p2p-port=30303
      - --discovery-enabled=false
      - --static-nodes-file=/config/static-nodes.json
      - --host-allowlist=*
      - --min-gas-price=0
    volumes:
      - ./config:/config:ro
      - ./nodes/node4:/keys:ro
      - besu-node-4-data:/data
    networks:
      besu-net:
        ipv4_address: 172.16.239.14

volumes:
  besu-node-1-data:
  besu-node-2-data:
  besu-node-3-data:
  besu-node-4-data:

networks:
  besu-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.239.0/24
